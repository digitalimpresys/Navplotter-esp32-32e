; Hardware probe for the 2.8" ESP32-32E display board: finds out what is really on the board
[env:probe]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 115200
build_flags =
	-DUSER_SETUP_LOADED=1
	-DILI9341_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DUSE_HSPI_PORT=1
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000
lib_deps =
	bodmer/TFT_eSPI@2.5.43
	mikalhart/TinyGPSPlus@^1.0.3
